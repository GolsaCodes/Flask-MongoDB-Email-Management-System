<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 20px auto;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .header {
            background-color: #007bff;
            color: #fff;
            padding: 20px;
            text-align: center;
            width: 100%;
        }
        
        .top-bar {
            background-color: #f2f2f2;
            padding: 10px 0;
            text-align: center;
            width: 100%;
        }
        
        .search-icon {
            color: #666;
            cursor: pointer;
        }
        
        .search-bar {
            display: inline-block;
            border-radius: 20px;
            border: 1px solid #ccc;
            padding: 8px 16px;
            margin-bottom: 10px;
        }
        
        .options-container {
            display: flex;
            justify-content: left;
            width: 100%;
        }
        
        .options {
            background-color: #f2f2f2;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        
        .options p {
            padding: 10px;
            transition: background-color 0.3s ease;
        }
        
        .options p:hover,
        .active-link {
            background-color: #007bff;
            color: #fff;
        }
        
        .options a {
            color: inherit;
            text-decoration: none;
        }

        .inbox-messages {
            
            margin: 20px;
            margin-left: 50px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .message {
            border-bottom: 1px solid #ddd;
            padding: 10px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        
        .message:last-child {
            border-bottom: none;
        }
        
        .message .sender {
            font-weight: bold;
            flex: 1;
        }
        
        .message .subject {
            flex: 2;
            color: #666;
        }
        
        .message .date {
            flex: 1;
            text-align: right;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Welcome to Gmail</h1>
    </div>
    <div class="top-bar">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-bar" placeholder="Search mail">
    </div>
    <div class="options-container">
        <div class="options">
            <p><a href="{{ url_for('new_email') }}" id="newEmail-link">New Email</a></p>
            <p><a href="{{ url_for('inbox') }}" id="inbox-link">Inbox</a></p>
            <p><a href="{{ url_for('sent') }}" id="sent-link">Sent</a></p>
            <p><a href="{{ url_for('report') }}" id="report-link">Report</a></p>
            <p><a href="{{ url_for('alphabetic_report') }}" id="report-link">Alphabetic Report</a></p>
            <p><a href="{{ url_for('unread_inbox') }}" id="unread-link">Unread Emails</a></p>

        </div>
        <div class="inbox-messages">
            <p><strong>Sender:</strong> {{ sender_name }} ({{ sender_email }})</p>
            <p><strong>Receiver:</strong> {{ receiver_name }} ({{ receiver_email }})</p>
            <p><strong>Date:</strong> {{ email_date }}</p>
            <p><strong>Email Content:</strong></p>
            <p>{{ email_content }}</p
        
        </div>
    </div>
</div>

<script>
    function openEmail(emailId) {
        window.open('sent_email_details/' + emailId, '_blank');
    
    }
</script>

</body>
</html>
