<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose New Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        
        .header {
            background-color: #007bff;
            color: #fff;
            padding: 20px;
            text-align: center;
            width: 100%;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        
        .email-form {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            font-weight: bold;
        }
        
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
        }
        
        .form-group textarea {
            height: 150px;
        }
        
        .form-group input[type="submit"] {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }
        
        .form-group input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>New Email</h1>
    </div>
    <div class="email-form">
        <form action="{{ url_for('new_email') }}" method="post">
            <div class="form-group">
                <label for="receiver_name">Receiver's Name:</label><br>
                <input type="text" id="receiver_name" name="receiver_name" required><br>
            </div>
            <div class="form-group">
                <label for="receiver_email">Receiver's Email:</label><br>
                <input type="email" id="receiver_email" name="receiver_email" required><br>
            </div>
            <div class="form-group">
                <label for="subject">Subject:</label><br>
                <input type="text" id="subject" name="subject" required><br>
            </div>
            <div class="form-group">
                <label for="email_content">Email Content:</label><br>
                <textarea id="email_content" name="email_content" rows="6" required></textarea><br>
            </div>
            <div class="form-group">
                <input type="submit" value="Send">
            </div>
        </form>
    </div>
</div>

</body>
</html>
